<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Traverse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            forest: '#2D3E2F',
            rust:   '#A64B2A',
            offwhite: '#F4F1EA',
            sand:   '#E8E2D4',
            sage:   '#7A8471',
            charcoal: '#1F1F1E',
          },
          fontFamily: {
            serif: ['Lora', 'Georgia', 'serif'],
            mono:  ['IBM Plex Mono', 'monospace'],
            sans:  ['Space Grotesk', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; padding: 0; }
    body { background-color: #F4F1EA; color: #1F1F1E; font-family: 'Space Grotesk', system-ui, sans-serif; }
    ::-webkit-scrollbar { width: 0; }
    input[type="date"]::-webkit-calendar-picker-indicator { opacity: 0.4; }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #2D3E2F; cursor: pointer; }
    input[type="range"]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: #D4CEC3; }
  </style>

  <!-- React -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Data (plain JS) -->
  <script src="traverse-data.js"></script>
</head>
<body>
<div id="root" class="h-screen"></div>

<!-- UI primitives -->
<script type="text/babel" src="traverse-ui.jsx"></script>
<!-- Screens -->
<script type="text/babel" src="traverse-screens.jsx"></script>

<!-- Root app -->
<script type="text/babel">
const { useState, useEffect } = React;

// Nav items
const NAV = [
  { id: "trips",  label: "Trips",
    icon: (active) => <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M3 17V8l8-5 8 5v9" stroke={active?"#F4F1EA":"#7A8471"} strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/><rect x="8" y="12" width="6" height="5" rx="0.5" stroke={active?"#F4F1EA":"#7A8471"} strokeWidth="1.4"/></svg> },
  { id: "gear",   label: "Gear",
    icon: (active) => <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><circle cx="11" cy="11" r="2.5" stroke={active?"#F4F1EA":"#7A8471"} strokeWidth="1.4"/><path d="M11 2v2M11 18v2M2 11h2M18 11h2M4.2 4.2l1.4 1.4M16.4 16.4l1.4 1.4M4.2 17.8l1.4-1.4M16.4 5.6l1.4-1.4" stroke={active?"#F4F1EA":"#7A8471"} strokeWidth="1.4" strokeLinecap="round"/></svg> },
  { id: "export", label: "Export",
    icon: (active) => <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><rect x="4" y="3" width="14" height="16" rx="1.5" stroke={active?"#F4F1EA":"#7A8471"} strokeWidth="1.4"/><path d="M8 8h6M8 11h6M8 14h4" stroke={active?"#F4F1EA":"#7A8471"} strokeWidth="1.4" strokeLinecap="round"/></svg> },
];

function App() {
  const [screen, setScreen] = useState(() => localStorage.getItem("traverse_screen") || "trips");
  const [activeTrip, setActiveTrip] = useState(null);
  const [showNewTrip, setShowNewTrip] = useState(false);
  const [checkedGear, setCheckedGear] = useState(() => {
    try { return JSON.parse(localStorage.getItem("traverse_gear") || "{}"); } catch { return {}; }
  });

  useEffect(() => { localStorage.setItem("traverse_screen", screen); }, [screen]);
  useEffect(() => { localStorage.setItem("traverse_gear", JSON.stringify(checkedGear)); }, [checkedGear]);

  const toggleGear = (id) => setCheckedGear(g => ({ ...g, [id]: !g[id] }));

  const mainTrip = DEMO_DATA.trips[0];

  const handleNavChange = (id) => {
    setScreen(id);
    setActiveTrip(null);
  };

  // Determine current main content
  let content;
  if (screen === "trips" && activeTrip) {
    content = <TripDetail trip={activeTrip} onBack={() => setActiveTrip(null)} checkedGear={checkedGear} onToggleGear={toggleGear} />;
  } else if (screen === "trips") {
    content = <TripsDashboard trips={DEMO_DATA.trips} onOpenTrip={setActiveTrip} onNewTrip={() => setShowNewTrip(true)} />;
  } else if (screen === "gear") {
    content = <GearLibrary />;
  } else if (screen === "export") {
    content = <ExportView trip={mainTrip} />;
  }

  return (
    <div className="h-screen flex" style={{ backgroundColor: "#F4F1EA" }}>
      {/* Desktop sidebar — athletic dark */}
      <aside className="hidden md:flex flex-col w-60 flex-shrink-0 h-full"
        style={{ backgroundColor: "#0D1A0E", borderRight: "1px solid #1A2E1B" }}>
        {/* Logo block */}
        <div className="px-6 pt-8 pb-6" style={{ borderBottom: "1px solid #1A2E1B" }}>
          <p className="font-mono text-xs tracking-widest uppercase mb-1" style={{ color: "#7A8471" }}>Est. 2026</p>
          <h1 className="text-2xl font-bold tracking-tight font-sans uppercase" style={{ color: "#F4F1EA", letterSpacing: "-0.02em" }}>Traverse</h1>
          <p className="text-xs font-mono mt-0.5" style={{ color: "#7A8471" }}>Bikepacking · Hiking</p>
        </div>

        {/* Nav */}
        <nav className="flex-1 px-3 pt-4 space-y-0.5">
          {NAV.map(item => {
            const active = screen === item.id;
            return (
              <button key={item.id} onClick={() => handleNavChange(item.id)}
                className="w-full flex items-center gap-3 px-3 py-3 rounded-lg text-left transition-all group"
                style={{ backgroundColor: active ? "#A64B2A" : "transparent" }}>
                {item.icon(active)}
                <span className="text-sm font-medium tracking-wide" style={{ color: active ? "#F4F1EA" : "#7A8471" }}>
                  {item.label}
                </span>
                {active && <div className="ml-auto w-1 h-1 rounded-full" style={{ backgroundColor: "#F4F1EA" }} />}
              </button>
            );
          })}
        </nav>

        {/* Trip in progress indicator */}
        <div className="mx-3 mb-3 p-3 rounded-lg" style={{ backgroundColor: "#1A2E1B" }}>
          <p className="font-mono text-xs tracking-widest uppercase mb-1" style={{ color: "#7A8471" }}>Next up</p>
          <p className="text-sm font-semibold" style={{ color: "#F4F1EA" }}>Kangaroo Valley</p>
          <p className="font-mono text-xs mt-0.5" style={{ color: "#A64B2A" }}>26 days · 47km</p>
        </div>

        {/* User */}
        <div className="px-5 py-5" style={{ borderTop: "1px solid #1A2E1B" }}>
          <div className="flex items-center gap-3">
            <div className="w-9 h-9 rounded-full flex items-center justify-center text-xs font-mono font-bold"
              style={{ backgroundColor: "#A64B2A", color: "#F4F1EA" }}>AH</div>
            <div>
              <p className="text-sm font-medium" style={{ color: "#F4F1EA" }}>Alex Hartley</p>
              <p className="text-xs font-mono" style={{ color: "#7A8471" }}>3 trips planned</p>
            </div>
          </div>
        </div>
      </aside>

      {/* Main content area */}
      <main className="flex-1 flex flex-col overflow-hidden">
        {/* Mobile top bar */}
        <div className="md:hidden flex items-center justify-between px-5 pt-10 pb-3 flex-shrink-0"
          style={{ borderBottom: "1px solid #D4CEC3", backgroundColor: "#0D1A0E" }}>
          <h1 className="text-lg font-bold tracking-tight uppercase font-sans" style={{ color: "#F4F1EA", letterSpacing: "-0.02em" }}>Traverse</h1>
          <div className="w-8 h-8 rounded-full flex items-center justify-center text-xs font-mono font-bold"
            style={{ backgroundColor: "#A64B2A", color: "#F4F1EA" }}>AH</div>
        </div>

        {/* Screen content */}
        <div className="flex-1 flex flex-col overflow-hidden">
          {content}
        </div>
      </main>

      {/* Mobile bottom nav */}
      <nav className="md:hidden fixed bottom-0 left-0 right-0 flex items-center justify-around px-2 pt-2"
        style={{ backgroundColor: "#0D1A0E", borderTop: "1px solid #1A2E1B", paddingBottom: "max(0.75rem, env(safe-area-inset-bottom))" }}>
        {NAV.map(item => {
          const active = screen === item.id && !activeTrip;
          return (
            <button key={item.id} onClick={() => handleNavChange(item.id)}
              className="flex flex-col items-center gap-1 px-4 py-1">
              {item.icon(active)}
              <span className="text-xs font-mono uppercase" style={{ color: active ? "#F4F1EA" : "#7A8471", letterSpacing: "0.08em", fontSize: "0.6rem" }}>{item.label}</span>
            </button>
          );
        })}
      </nav>

      {/* New trip modal */}
      {showNewTrip && <NewTripModal onClose={() => setShowNewTrip(false)} />}

      {/* Tweaks panel */}
      <TweaksPanel />
    </div>
  );
}

// ── Tweaks ─────────────────────────────────────────────────────────────
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accentColor": "#4A5568",
  "density": "comfortable",
  "showCountry": true
}/*EDITMODE-END*/;

function TweaksPanel() {
  const [open, setOpen] = useState(false);
  const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);

  useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === "__activate_edit_mode") setOpen(true);
      if (e.data?.type === "__deactivate_edit_mode") setOpen(false);
    };
    window.addEventListener("message", handler);
    // Apply stored accent on mount
    document.documentElement.style.setProperty("--accent", tweaks.accentColor);
    window.parent.postMessage({ type: "__edit_mode_available" }, "*");
    return () => window.removeEventListener("message", handler);
  }, []);

  const set = (k, v) => {
    const next = { ...tweaks, [k]: v };
    setTweaks(next);
    window.parent.postMessage({ type: "__edit_mode_set_keys", edits: next }, "*");
    document.documentElement.style.setProperty("--accent", next.accentColor);
  };

  if (!open) return null;

  return (
    <div className="fixed bottom-24 right-4 z-50 w-56 rounded-xl shadow-md p-4 space-y-4"
      style={{ backgroundColor: "#E8E2D4", border: "1px solid #D4CEC3" }}>
      <p className="text-xs font-mono font-semibold tracking-widest uppercase" style={{ color: "#7A8471" }}>Tweaks</p>
      <div>
        <p className="text-xs font-mono mb-2" style={{ color: "#7A8471" }}>Accent colour</p>
        <div className="flex gap-2">
          {["#A64B2A", "#2D6A4F", "#6B4226", "#4A5568"].map(c => (
            <button key={c} onClick={() => set("accentColor", c)}
              className="w-7 h-7 rounded-md flex-shrink-0"
              style={{ backgroundColor: c, outline: tweaks.accentColor === c ? `2px solid #1F1F1E` : "none", outlineOffset: "2px" }} />
          ))}
        </div>
      </div>
      <div>
        <p className="text-xs font-mono mb-2" style={{ color: "#7A8471" }}>Density</p>
        <div className="flex gap-1">
          {["compact", "comfortable"].map(d => (
            <button key={d} onClick={() => set("density", d)}
              className="flex-1 py-1.5 rounded text-xs capitalize"
              style={{ backgroundColor: tweaks.density === d ? "#2D3E2F" : "#F4F1EA", color: tweaks.density === d ? "#F4F1EA" : "#7A8471" }}>
              {d}
            </button>
          ))}
        </div>
      </div>
      <div className="flex items-center justify-between">
        <p className="text-xs font-mono" style={{ color: "#7A8471" }}>Show country</p>
        <button onClick={() => set("showCountry", !tweaks.showCountry)}
          className="w-9 h-5 rounded-full relative"
          style={{ backgroundColor: tweaks.showCountry ? "#2D3E2F" : "#D4CEC3" }}>
          <div className="absolute top-0.5 w-4 h-4 rounded-full bg-white transition-all"
            style={{ left: tweaks.showCountry ? "calc(100% - 18px)" : "2px" }} />
        </button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
